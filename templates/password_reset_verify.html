{% extends "base.html" %}

{% block content %}
<div class="d-flex align-items-center justify-content-center auth-fullscreen-bg">

    <div class="glass-panel p-5 fade-in-up" style="max-width: 440px; width: 100%; border: 1px solid var(--border-card); background: var(--bg-card);">

        <div class="text-center mb-4">
            <img src="/media/logo.png" alt="PlantCare Logo" width="80" height="80" class="mb-2 auth-logo">
            <h2 class="fw-extrabold m-0" style="font-size: 1.8rem; letter-spacing: -0.5px;">Set New Password</h2>
            <p class="text-muted mt-1" style="font-size: 0.9rem;">Enter the OTP sent to your email and choose a new password.</p>
        </div>

        {% if error %}
        <div class="alert alert-danger text-center py-2" role="alert"
             style="border-radius: 10px; font-size: 0.9rem;">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" id="password-reset-otp-form" class="d-flex flex-column gap-3">
            {% csrf_token %}
            <div class="form-group m-0">
                <label class="form-label">Email Address</label>
                <input
                    type="email"
                    id="email-input"
                    name="email"
                    class="form-control"
                    value="{{ email }}"
                    placeholder="you@example.com"
                    required>
            </div>

            <div class="form-group m-0">
                <label class="form-label">OTP</label>
                <input
                    type="text"
                    id="otp-input"
                    name="otp"
                    class="form-control text-center"
                    placeholder="e.g. 482913"
                    maxlength="6"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    autocomplete="one-time-code"
                    required
                    style="font-size: 1.4rem; letter-spacing: 0.35rem; font-weight: 700;">
            </div>

            <div class="form-group m-0">
                <label class="form-label">New Password</label>
                <input
                    type="password"
                    id="new-password-input"
                    name="new_password"
                    class="form-control"
                    placeholder="Min. 8 characters"
                    minlength="8"
                    required>
                <div class="form-check mt-2">
                    <input class="form-check-input" type="checkbox" id="showPasswordCheckReset" onclick="togglePasswordVisibility()">
                    <label class="form-check-label text-muted small" for="showPasswordCheckReset" style="cursor: pointer;">
                        Show Password / પાસવર્ડ બતાવો / पासवर्ड दिखाएं
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-custom-primary w-100 py-3 mt-2" style="font-size: 1.05rem;">
                Reset Password
            </button>
        </form>

        <div class="text-center mt-4" style="font-size: 0.85rem;">
            <a href="{% url 'password_reset_request' %}" style="color: var(--text-secondary); text-decoration: none;">
                &larr; Resend OTP
            </a>
        </div>
    </div>
</div>
{% endblock %}
